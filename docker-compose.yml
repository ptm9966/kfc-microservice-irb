services:
  # Cart Microservice
  cart-service:
    build:
      context: ./cartMicroservice
      dockerfile: Dockerfile
    container_name: kfc-cart-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      SQL_SERVER: kfc-sql-server
      SQL_PORT: 1433
      SQL_DATABASE: cart-database
      SQL_USER: sa
      SQL_PASSWORD: "Ptm@19941225"
      SQL_ENCRYPT: "false"
      SQL_TRUST_SERVER_CERTIFICATE: "true"
      SQL_CREATE_DATABASE: "true"
      SQL_AUTO_CREATE_SCHEMA: "true"
      USERS_SERVICE_URL: http://users-service:8082
      FRONTEND_URL: http://localhost:3000
    depends_on:
      kfc-sql-server:
        condition: service_healthy
      users-service:
        condition: service_started
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orders Microservice
  orders-service:
    build:
      context: ./OrdersMicroservice
      dockerfile: Dockerfile
    container_name: orders-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
      PORT: 8081
      USERS_SERVICE_URL: http://users-service:8082
      SQL_SERVER: kfc-sql-server
      SQL_PORT: 1433
      SQL_DATABASE: orders-database
      SQL_USER: sa
      SQL_PASSWORD: "Ptm@19941225"
      SQL_ENCRYPT: "false"
      SQL_TRUST_SERVER_CERTIFICATE: "true"
      SQL_CREATE_DATABASE: "true"
      SQL_AUTO_CREATE_SCHEMA: "true"
    depends_on:
      kfc-sql-server:
        condition: service_healthy
    networks:
      - kfc-network
    healthcheck:
      test: curl -f http://localhost:8081/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Shared SQL Server database for local development
  kfc-sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kfc-sql-server
    restart: always
    ports:
      - "127.0.0.1:14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Ptm@19941225"
    volumes:
      - kfc_sql_data:/var/opt/mssql
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # User/Auth Microservice
  users-service:
    build:
      context: ./UserMicroservice
      dockerfile: Dockerfile
    container_name: users-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      SQL_SERVER: kfc-sql-server
      SQL_PORT: 1433
      SQL_DATABASE: users-database
      SQL_USER: sa
      SQL_PASSWORD: "Ptm@19941225"
      SQL_ENCRYPT: "false"
      SQL_TRUST_SERVER_CERTIFICATE: "true"
      SQL_CREATE_DATABASE: "true"
      SQL_AUTO_CREATE_SCHEMA: "true"
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      AUTH0_ISSUER: https://dev-6l85tc0ex15xt2oe.us.auth0.com/
      AUTH0_AUDIENCE: http://localhost:8082
      AUTH0_DOMAIN: dev-6l85tc0ex15xt2oe.us.auth0.com
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET}
    depends_on:
      kfc-sql-server:
        condition: service_healthy
    networks:
      - kfc-network
    healthcheck:
      test: curl -f http://localhost:8082/api-docs || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Product Microservice
  products-service:
    build:
      context: ./ProductMicroservice
      dockerfile: Dockerfile
    container_name: products-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      NODE_ENV: production
      PORT: 8083
      SQL_SERVER: kfc-sql-server
      SQL_PORT: 1433
      SQL_DATABASE: products-database
      SQL_USER: sa
      SQL_PASSWORD: "Ptm@19941225"
      SQL_ENCRYPT: "false"
      SQL_TRUST_SERVER_CERTIFICATE: "true"
      SQL_CREATE_DATABASE: "true"
      SQL_AUTO_CREATE_SCHEMA: "true"
    depends_on:
      kfc-sql-server:
        condition: service_healthy
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: kfc-api-gateway
    restart: always
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      PORT: 9000
      AUTH0_ISSUER: https://dev-6l85tc0ex15xt2oe.us.auth0.com/
      AUTH0_AUDIENCE: http://localhost:8082
      USERS_SERVICE_URL: http://users-service:8082
      ORDERS_SERVICE_URL: http://orders-service:8081
      CART_SERVICE_URL: http://cart-service:8080
      PRODUCTS_SERVICE_URL: http://products-service:8083
    depends_on:
      - cart-service
      - orders-service
      - users-service
      - products-service
    networks:
      - kfc-network
 

volumes:
  kfc_sql_data:
    driver: local
networks:
  kfc-network:
    driver: bridge
