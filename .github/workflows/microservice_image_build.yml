name: order-api-pipeline
permissions:
  contents: read
  id-token: write
  actions: write
  packages: write
on:
  workflow_dispatch:

jobs:
  build:
   runs-on: ubuntu-latest
   steps:
     - name: "checku_out"
       uses: actions/checkout@v6.0.2
     - name: "github_registry_login"
       uses: docker/login-action@v4
       with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
     - name: "present working directory"
       run: |
           pwd
           ls -lah
    
     - name: "OrdersMicroservice-api-image-build"
       working-directory: OrdersMicroservice
       run: |
          docker --version
          docker build -f Dockerfile -t ghcr.io/ptm9966/kfc-ordersmicroservice-irb:${{ github.sha }} .
          docker images
     - name: "ProductMicroservice-api-image-build"
       working-directory: ProductMicroservice
       run: |
          docker --version
          docker build -f Dockerfile -t ghcr.io/ptm9966/kfc-productmicroservice-irb:${{ github.sha }} .
          docker images
     - name: "UserMicroservice-api-image-build"
       working-directory: UserMicroservice
       run: |
          docker --version
          docker build -f Dockerfile -t ghcr.io/ptm9966/kfc-usermicroservice-irb:${{ github.sha }} .
          docker images
     - name: "cartMicroservice-api-image-build"
       working-directory: cartMicroservice
       run: |
          docker --version
          docker build -f Dockerfile \
            -t ghcr.io/ptm9966/kfc-cartmicroservice-irb:${{ github.sha }} \
            -t ghcr.io/ptm9966/kfc-cartmicroservice-irb:latest .
          docker images
     - name: "api-gateway-image-build"
       working-directory: api-gateway
       run: |
          docker build -f Dockerfile \
            -t ghcr.io/ptm9966/kfc-api-gateway-irb:${{ github.sha }} \
            -t ghcr.io/ptm9966/kfc-api-gateway-irb:latest .


     - name: "Push image to github"
       run: |
          docker push ghcr.io/ptm9966/kfc-cartmicroservice-irb:${{ github.sha }}
          docker push ghcr.io/ptm9966/kfc-cartmicroservice-irb:latest
          docker push ghcr.io/ptm9966/kfc-api-gateway-irb:${{ github.sha }}
          docker push ghcr.io/ptm9966/kfc-api-gateway-irb:latest
          docker push ghcr.io/ptm9966/kfc-usermicroservice-irb:${{ github.sha }}
          docker push ghcr.io/ptm9966/kfc-productmicroservice-irb:${{ github.sha }}
          docker push ghcr.io/ptm9966/kfc-ordersmicroservice-irb:${{ github.sha }}
    




          
          
       
       
  
