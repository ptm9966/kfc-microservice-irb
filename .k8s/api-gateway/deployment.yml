apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: domain-service-v3
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/ptm9966/kfc-api-gateway-irb:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "9000"
            - name: USERS_API_HOST
              value: users.arb-api.qa.bikkam.online
            - name: CART_API_HOST
              value: cart.arb-api.qa.bikkam.online
            - name: ORDERS_API_HOST
              value: orders.arb-api.qa.bikkam.online
            - name: USERS_SERVICE_URL
              value: http://users-service.domain-service-v3.svc.cluster.local:8082
            - name: CART_SERVICE_URL
              value: http://cart-service.domain-service-v3.svc.cluster.local:8080
            - name: ORDERS_SERVICE_URL
              value: http://orders-service.domain-service-v3.svc.cluster.local:8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
