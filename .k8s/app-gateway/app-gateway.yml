apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: app-gateway
  namespace: domain-service-v3
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "users.arb-api.qa.bikkam.online"
        - "cart.arb-api.qa.bikkam.online"
        - "orders.arb-api.qa.bikkam.online"