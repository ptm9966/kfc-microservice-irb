apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: orders-service-arb-api
  namespace: domain-services-v3
spec:
  hosts:
    - orders.arb-api.qa.bikkam.online
  gateways:
    - app-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: digital-exp-api.domain-services-v3.svc.cluster.local
            port:
              number: 9000
