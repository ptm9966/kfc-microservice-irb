apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: digital-exp-api
  namespace: domain-services-v3
spec:
  hosts:
    - digital-exp-api.arb-api.qa.bikkam.online
  gateways:
    - istio-system/ib-wildcard
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: digital-exp-api
            port:
              number: 9000
