apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: domain-service-v3
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: ghcr.io/ptm9966/kfc-cartmicroservice-irb:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: SQL_SERVER
              value: kfc-sql-server.domain-service-v3.svc.cluster.local
            - name: SQL_PORT
              value: "1433"
            - name: SQL_DATABASE
              value: cart-database
            - name: SQL_CREATE_DATABASE
              value: "false"
            - name: SQL_ENCRYPT
              value: "true"
            - name: SQL_TRUST_SERVER_CERTIFICATE
              value: "true"
            - name: SQL_AUTO_CREATE_SCHEMA
              value: "true"
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: cart-service-secrets
                  key: SQL_USER
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cart-service-secrets
                  key: SQL_PASSWORD
            - name: USERS_SERVICE_URL
              value: http://users-service.domain-service-v3.svc.cluster.local:8082
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
