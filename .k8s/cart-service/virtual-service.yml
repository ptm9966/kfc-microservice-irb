apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cart-service
  namespace: domain-service-v3
spec:
  hosts:
    - arb-api.qa.bikkam.online
  gateways:
    - app-gateway
  http:
    - match:
        - uri:
            prefix: /api/cart
      route:
        - destination:
            host: cart-service.domain-service-v3.svc.cluster.local
            port:
              number: 8080
