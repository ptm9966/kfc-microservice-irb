apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cart-service
  namespace: domain-service-v3
spec:
  hosts:
    - api.example.com
  gateways:
    - kfc-api-gateway
  http:
    - match:
        - uri:
            prefix: /api/cart
      route:
        - destination:
            host: cart-service.domain-service-v3.svc.cluster.local
            port:
              number: 8080
