apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: domain-service-v3
  labels:
    app: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: ghcr.io/ptm9966/kfc-usermicroservice-irb:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8082"
            - name: SQL_SERVER
              value: kfc-sql-server.domain-service-v3.svc.cluster.local
            - name: SQL_PORT
              value: "1433"
            - name: SQL_DATABASE
              value: users-database
            - name: SQL_CREATE_DATABASE
              value: "false"
            - name: SQL_ENCRYPT
              value: "true"
            - name: SQL_TRUST_SERVER_CERTIFICATE
              value: "true"
            - name: SQL_AUTO_CREATE_SCHEMA
              value: "true"
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: SQL_USER
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: SQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
