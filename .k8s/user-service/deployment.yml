apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: domain-service-v3
  labels:
    app: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: ghcr.io/ptm9966/kfc-usermicroservice-irb:e6c32f172f500ff5515043f7210237f62174d636
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8082"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kfc-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kfc-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kfc-secrets
                  key: MONGO_INITDB_DATABASE
            - name: DB_URL
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@kfc-mongodb.domain-service-v3.svc.cluster.local:27017/$(MONGO_DATABASE)?authSource=admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
