apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: users-service
  namespace: domain-service-v3
spec:
  hosts:
    - users.arb-api.qa.bikkam.online
  gateways:
    - istio-system/ib-wildcard
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: digital-exp-api.domain-service-v3.svc.cluster.local
            port:
              number: 9000
