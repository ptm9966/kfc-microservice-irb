apiVersion: v1
kind: ConfigMap
metadata:
  name: kfc-sql-server-bootstrap
  namespace: domain-services-v3
data:
  bootstrap.sql: |
    IF DB_ID(N'users-database') IS NULL CREATE DATABASE [users-database];
    IF DB_ID(N'orders-database') IS NULL CREATE DATABASE [orders-database];
    IF DB_ID(N'cart-database') IS NULL CREATE DATABASE [cart-database];
    IF DB_ID(N'products-database') IS NULL CREATE DATABASE [products-database];
